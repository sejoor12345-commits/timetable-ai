# 자동 검사(CI): GitHub에 코드를 올리거나 PR을 만들 때마다 GitHub 컴퓨터가 테스트를 대신 돌려 준다.
# 결과는 GitHub 저장소의 Actions 탭, 또는 PR 아래 체크 표시(✓ / ✕)에서 볼 수 있다.
# 진짜 OpenRouter·Supabase에는 요청을 보내지 않는다 (모두 가짜로 시험). API 키가 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: 계산 엔진 + Vercel 함수 (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 테스트 (runTests 224개 + api/ 함수)
        run: npm test

  python:
    name: Colab 서버 (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: pip install pytest requests
      - name: 테스트 (pytest)
        run: python -m pytest tests/ -q

  e2e:
    name: 휴대폰 화면 끝까지 눌러 보기 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright 설치 (이 검사에서만 씀. 앱에는 들어가지 않음)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 화면 시험
        run: node tests/e2e-smoke.mjs test-results
      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
